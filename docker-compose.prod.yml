# Production Docker Compose Configuration

version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ecosat-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-ecosat}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ecosat
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecosat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecosat-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ecosat-backend:latest
    container_name: ecosat-backend-prod
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://${DB_USER:-ecosat}:${DB_PASSWORD}@db:5432/ecosat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GEE_PROJECT_ID: ${GEE_PROJECT_ID}
      GEE_SERVICE_ACCOUNT_JSON: ${GEE_SERVICE_ACCOUNT_JSON}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - tiles_data_prod:/data/tiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ecosat-backend:latest
    container_name: ecosat-worker-prod
    command: celery -A pipeline.scheduler worker --loglevel=info
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://${DB_USER:-ecosat}:${DB_PASSWORD}@db:5432/ecosat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GEE_PROJECT_ID: ${GEE_PROJECT_ID}
      GEE_SERVICE_ACCOUNT_JSON: ${GEE_SERVICE_ACCOUNT_JSON}
    depends_on:
      - db
      - redis
      - backend
    restart: always

  scheduler:
    image: ecosat-backend:latest
    container_name: ecosat-scheduler-prod
    command: celery -A pipeline.scheduler beat --loglevel=info
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://${DB_USER:-ecosat}:${DB_PASSWORD}@db:5432/ecosat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  tiles_data_prod:
    driver: local
